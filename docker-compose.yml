services:
  timer_job:
    build: .
    command: php /var/www/html/Jobs/timer_job.php
    user: www-data
    environment:
      BOMB_DB_PATH: /var/lib/bomb-data/bomb.sqlite
    volumes:
      - ./src:/var/www/html
      - bomb_data:/var/lib/bomb-data
    restart: unless-stopped
    networks:
      - ctf_net

  bomb_panel:
    build: .
    depends_on:
      - timer_job
    ports:
      - "8000:80"
      - "2222:22"
    environment:
      BOMB_DB_PATH: /var/lib/bomb-data/bomb.sqlite
    volumes:
      - ./src:/var/www/html
      - bomb_data:/var/lib/bomb-data
    networks:
      - ctf_net
  
  ftp_server:
    image: fauria/vsftpd
    ports:
      - "21:21"
      - "20:20"
      - "21100-21110:21100-21110"
    environment:
      - FTP_USER=Junior
      - FTP_PASS=password123!
      - PASV_MIN_PORT=21100
      - PASV_MAX_PORT=21110
      - PASV_ADDRESS=127.0.0.1
    volumes:
      - ./ftp_data:/home/vsftpd/Junior
    networks:
      - ctf_net

networks:
  ctf_net:
    driver: bridge

volumes:
  bomb_data:
